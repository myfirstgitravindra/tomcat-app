name: Build and Deploy to VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Java for Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build WAR (includes latest index.jsp)
      - name: Build WAR
        run: mvn clean package -DskipTests

      # 4. Login to ACR
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_LOGIN_SERVER }} \
            -u ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      # 5. Build and push image
      - name: Build and Push
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/tomcat-app
          docker build -t $IMAGE:${{ github.run_number }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.run_number }}
          docker push $IMAGE:latest

      # 6. Deploy to VM (auto-cleans port 8080)
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            # Login to ACR
            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              ${{ secrets.ACR_LOGIN_SERVER }} \
              -u ${{ secrets.ACR_USERNAME }} \
              --password-stdin

            # Pull new image
            docker pull ${{ secrets.ACR_LOGIN_SERVER }}/tomcat-app:${{ github.run_number }}

            # Remove ANY container holding port 8080 (including tomcat-test)
            for cid in $(docker ps -aq); do
              if docker port "$cid" 2>/dev/null | grep -q '8080'; then
                docker rm -f "$cid" 2>/dev/null || true
              fi
            done

            # Remove old tomcat-app container if it exists
            docker rm -f tomcat-app 2>/dev/null || true

            # Run the new container
            docker run -d \
              --name tomcat-app \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ secrets.ACR_LOGIN_SERVER }}/tomcat-app:${{ github.run_number }}

            # Show running container
            docker ps
