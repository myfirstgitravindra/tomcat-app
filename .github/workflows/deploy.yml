name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - uses: actions/checkout@v4

      # 2. Login to ACR
      - name: Login
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # 3. Build + push with run number as tag
      - name: Build and Push
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/tomcat-app:${{ github.run_number }}
          docker build -t $IMAGE .
          docker push $IMAGE

      # 4. SSH to VM and run the new image
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            docker pull ${{ secrets.ACR_LOGIN_SERVER }}/tomcat-app:${{ github.run_number }}
            docker stop tomcat-app || true
            docker rm tomcat-app || true
            docker run -d --name tomcat-app -p 8080:8080 \
              ${{ secrets.ACR_LOGIN_SERVER }}/tomcat-app:${{ github.run_number }}